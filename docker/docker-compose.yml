version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: universal_ergonomics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    image: universal-ergonomics-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/universal_ergonomics
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/universal_ergonomics
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    depends_on:
      - db
      - redis
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

  celery-worker:
    image: universal-ergonomics-backend
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/universal_ergonomics
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/universal_ergonomics
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - db
      - redis

  celery-beat:
    image: universal-ergonomics-backend
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/universal_ergonomics
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/universal_ergonomics
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
      - db
      - redis

volumes:
  pgdata:
